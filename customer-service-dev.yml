spring:
  datasource:
    url: jdbc:postgresql://customer-db:5432/customerdb
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        enabled: true
        register: true
server:
  port: 8081